name: E2E tests

on:
  workflow_dispatch:
  # Turned off for now, because this is a test project. Uncomment to run every night at 00:00 UTC.
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Firefox, because solflare.com blocks Chrome's headless browser
      - run: npm run test:e2e:firefox:headless
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: |
            logs
            screenshots
