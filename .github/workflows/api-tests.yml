name: API tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:api
      # Run even if the tests fail, so one problem doesn't hide another
      - run: npm run typecheck
        if: always()
      - run: npm run format:check
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-report
          path: reports/api
